          type: string
          maxLength: 2000
        target_per_week:
          type: integer
          minimum: 1
          maximum: 7
    CompleteHabit:
      type: object
      additionalProperties: false
      required: [completed_on]
      properties:
        completed_on:
          type: string
          format: date
    HabitCompletion:
      type: object
      required: [id, habit_id, user_id, completed_on, is_mine, created_at]
      properties:
        id:
          type: string
          format: uuid
        habit_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        completed_on:
          type: string
          format: date
        is_mine:
          type: boolean
        created_at:
          type: string
          format: date-time
    HabitStats:
      type: object
      required: [habit_id, from, to, target_per_week, total_completions, members]
      properties:
        habit_id:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        target_per_week:
          type: integer
          minimum: 1
          maximum: 7
        total_completions:
          type: integer
          minimum: 0
        members:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/HabitMemberStats"
    HabitMemberStats:
      type: object
      required: [user_id, completion_count, successful_weeks, current_streak_weeks]
      properties:
        user_id:
          type: string
          format: uuid
        completion_count:
          type: integer
          minimum: 0
        successful_weeks:
          type: integer
          minimum: 0
        current_streak_weeks:
          type: integer
          minimum: 0
    CreateCoupleResponse:
      type: object
      required: [couple_id, status]
      properties:
        couple_id:
          type: string
          format: uuid
        status:
          type: string
          const: pending
    Invitation:
      type: object
      required: [invitation_id, code, token, expires_at]
      properties:
        invitation_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[0-9]{6}$"
        token:
          type: string
        expires_at:
          type: string
          format: date-time
    AcceptInvitationResponse:
      type: object
      required: [couple_id, status, message]
      properties:
        couple_id:
          type: string
          format: uuid
        status:
          type: string
          const: active
        message:
          type: string
    CoupleMember:
      type: object
      required: [user_id, email, nickname, mascot_type, joined_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nickname:
          type: [string, "null"]
        mascot_type:
          type: string
          enum: [kitten, wolf]
        joined_at:
          type: string
          format: date-time
    MyCouple:
      type: object
      required: [couple_id, status, created_at, members]
      properties:
        couple_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, active]
        created_at:
          type: string
          format: date-time
        activated_at:
          type: [string, "null"]
          format: date-time
        members:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/CoupleMember"
    UpdateMemberProfile:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 50
        mascot_type:
          type: string
          enum: [kitten, wolf]
    DetachResponse:
      type: object
      required: [couple_id, status, confirmed, message]
      properties:
        couple_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, detached]
        confirmed:
          type: boolean
        message:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
  responses:
    BadRequest:
      description: Некорректный запрос.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Требуется авторизация или учётные данные неверны.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Запрос конфликтует с текущим состоянием ресурса.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Ресурс не найден.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: Срок действия приглашения истёк.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Превышен лимит запросов.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Временная зависимость API недоступна.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Внутренняя ошибка сервера.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
