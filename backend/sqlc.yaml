version: "2"
sql:
  - schema: "migrations/"
    queries: "sql/queries/"
    gen:
      go:
        package: "db"
        out: "sql/generated"
        emit_interface: true
        emit_exact_table_names: true
        emit_methods_with_argument_block: true
        emit_queried_table_struct_after_model_definition: true
        emit_prepared_queries: false
        emit_result_struct_pointers: false
        emit_tags_with_column_type: true
        override:
          - column: "created_at"
            go_type: "time.Time"
          - column: "updated_at"
            go_type: "time.Time"
          - column: "deleted_at"
            go_type: "time.Time"
